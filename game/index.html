<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SILENT VAULT — a museum heist stealth game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1220; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="SILENT VAULT: a top-down stealth heist. Steal the Aurora Diamond and reach the getaway van without being seen."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<!-- Classic scripts (no modules) so the game also opens from file://.
     Loaded in dependency order: config, random, levels, world, input,
     sound, render, shots, then main. -->
<script src="./src/config.js"></script>
<script src="./src/random.js"></script>
<script src="./src/levels.js"></script>
<script src="./src/world.js"></script>
<script src="./src/input.js"></script>
<script src="./src/sound.js"></script>
<script src="./src/render.js"></script>
<script src="./src/shots.js"></script>
<script src="./src/main.js"></script>
</body>
</html>
